# LLM used to restructure / enrich / generate the dataset (Gemini API, cheapest tier).
# Key: GEMINI_API_KEY in ./.env.
provider: gemini
model: gemini-3.1-flash-lite     # $0.25 in / $1.50 out per 1M (Standard); whole dataset ≈ $0.50
thinking_level: minimal        # no thinking tokens (thinkingBudget is rejected by this model)
concurrency: 8                 # parallel requests
http_attempts: 6               # 429/5xx backoff attempts per request
max_tokens_per_item: 60        # output budget per sentence in a batch (translit needs the most)
retries: 2                     # per-item retries after a bad / missing answer

passes:
  # ------------------------------------------------------------------ 1
  translit:
    prompt_version: 2            # v2: compact [id, text] rows
    batch_size: 25
    temperature: 0.2
    system: |
      You convert romanized Bangla ("Banglish") and Bangla-English mixed customer messages into
      natural Bangla script, exactly as a Bangla speech-to-text system would write them.
      Rules:
      - Keep the meaning and tone exactly; do not add or remove information.
      - Write Bangla words in Bangla script. Common English e-commerce words stay as English
        loanwords written in Bangla script (order→অর্ডার, delivery→ডেলিভারি, cancel→ক্যান্সেল,
        refund→রিফান্ড, bKash→বিকাশ), brand/model names stay in Latin script.
      - Fix obvious spelling mistakes.
      Return ONLY a JSON array with one row per input, same ids: [[id, "bangla text"], ...]
    example_in: '[{"id": 1, "text": "amar order ta cancel kore den"}, {"id": 2, "text": "laptop er dam কত"}]'
    example_out: '[[1, "আমার অর্ডারটা ক্যান্সেল করে দেন"], [2, "ল্যাপটপের দাম কত"]]'

  # ------------------------------------------------------------------ 2
  label:
    prompt_version: 2            # v2: gold intent hidden (v1 just copied it); compact output
    batch_size: 40
    temperature: 0.2
    system: |
      You label customer messages sent to a Bangladeshi e-commerce support voice agent.
      Messages may be in Bangla, English, Banglish or mixed. Intents:
      {intents}
      For each message decide:
      - intent: the single best intent.
      - alt: a second intent a careful human could reasonably pick instead, or null if the
        message is clear.
      - esc: 1 if a human agent should take over (explicitly asks for a human/manager, very
        angry, threatens, legal/fraud issue, repeated failed attempts), else 0.
      Return ONLY a compact JSON array with one row per input: [id, "intent", "alt" or null, esc]
    example_in: '[{"id": 1, "text": "টাকা কেটে নিয়েছে কিন্তু অর্ডার দেখাচ্ছে না"}, {"id": 2, "text": "manager er sathe kotha bolte chai"}]'
    example_out: '[[1, "payment_issue", "order_status", 0], [2, "agent_request", null, 1]]'

  # ------------------------------------------------------------------ 3
  confirm_gen:
    prompt_version: 1
    per_call: 12                 # utterances requested per call
    temperature: 0.9
    system: |
      A Bangladeshi e-commerce voice agent has just read an order back to a customer and asked
      "আপনার অর্ডারটি কি কনফার্ম করে দেব?" (Shall I confirm your order?).
      Write short, realistic spoken replies a Bangladeshi customer might say, the way a Bangla
      speech-to-text system would transcribe them (Bangla script; common English words like
      অর্ডার, কনফার্ম, ক্যান্সেল written in Bangla script). Vary politeness (জি/আচ্ছা/ভাই/আপু),
      length (1–10 words), fillers (উম, মানে, আসলে, হুম), and regional/colloquial forms.
      Every reply MUST clearly carry the given meaning. Do not repeat the seed examples verbatim.
      Return ONLY a JSON object: {"utterances": ["...", "..."]}
    meanings:
      "yes": "the customer AGREES — confirm the order"
      "no": "the customer REFUSES — do not confirm / cancel the order"
      "repeat": "the customer did not hear or understand and asks the agent to say it again"
    # Extra styles requested round-robin to force hard cases.
    styles:
      "yes":
        - "plain agreement"
        - "starts with না/না না but then agrees (e.g. না না ঠিক আছে দিয়ে দেন)"
        - "agreement plus a small request (e.g. হ্যাঁ, একটু তাড়াতাড়ি পাঠাবেন)"
        - "hesitant but finally agrees, with fillers"
      "no":
        - "plain refusal"
        - "starts with হ্যাঁ/জি but then refuses (e.g. হ্যাঁ লাগবে না, জি না থাক)"
        - "polite refusal with a reason (e.g. এখন টাকা নেই, পরে নিব)"
        - "cancel using the English word ক্যান্সেল"
      "repeat":
        - "did not hear because of noise or a bad line"
        - "did not understand, asks to say it again"
        - "asks what the agent said (e.g. কী বললেন?)"

  # ------------------------------------------------------------------ 4
  # Blind cross-check of generated order-confirm replies. The model does NOT see the intended
  # label; rows where it disagrees are sorted to the top of reports/confirm_review.csv so the
  # human review starts with the risky ones. It never accepts or rejects anything by itself.
  confirm_verify:
    prompt_version: 1
    batch_size: 40
    temperature: 0.0
    system: |
      A Bangladeshi e-commerce voice agent asked a customer "আপনার অর্ডারটি কি কনফার্ম করে দেব?"
      (Shall I confirm your order?). Classify each customer reply as exactly one of:
      yes (confirms the order), no (refuses / cancels), repeat (did not hear or understand,
      asks to say it again), out_of_scope (asks or says something else).
      Return ONLY a compact JSON array with one row per input: [id, "label"]
    example_in: '[{"id": 1, "text": "না না ঠিক আছে দিয়ে দেন"}, {"id": 2, "text": "হ্যাঁ, কিন্তু এখন লাগবে না"}]'
    example_out: '[[1, "yes"], [2, "no"]]'
